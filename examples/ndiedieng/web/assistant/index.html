<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<base href="/ndiedieng/">
<meta name="ndiedieng-mode" content="local">
<title>Assistant · Ndiédieng</title>
<meta name="description" content="L'assistant de la Mairie de Ndiédieng : des questions sur les fiches de la commune et les signalements des villages, à l'écrit ou à la voix, avec les données utilisées. Construit avec Kalangu.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="assistant.css">
<script type="importmap">{ "imports": { "@kalangu/core": "./vendor/core/index.js", "@kalangu/sim": "./vendor/sim/phone.js" } }</script>
<script type="module" src="assistant.js"></script>
</head>
<body class="gem">
<header class="gem-top">
  <a class="back" href="./" aria-label="Retour au tableau de bord">
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    <span>Tableau de bord</span>
  </a>
  <p class="gem-name">Assistant <span class="thin">· Mairie de Ndiédieng</span></p>
  <div class="gem-actions">
    <button type="button" class="gem-icon" id="restart" aria-label="Nouvelle conversation" title="Nouvelle conversation" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</header>

<main class="gem-main" id="scroller">
  <div class="gem-col">
    <section class="hello" id="hello" aria-labelledby="hello-title">
      <h1 id="hello-title"><span class="grad">Bonjour,</span><br><span class="hello-2">touchez l'orbe et posez votre question.</span></h1>
      <div class="ideas" id="ideas" aria-label="Suggestions"></div>
    </section>
    <div class="convo" id="thread" aria-live="polite"></div>
  </div>
</main>

<footer class="gem-foot">
  <div class="aurora" id="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="live" id="live" aria-live="polite"></p>
  <form class="prompt" id="ask-form" hidden>
    <label class="visually-hidden" for="question">Votre question</label>
    <textarea id="question" rows="1" placeholder="Écrivez votre question" autocomplete="off" enterkeyhint="send"></textarea>
    <button type="submit" class="gem-icon send" id="send" aria-label="Envoyer">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <div class="dock">
    <button type="button" class="gem-icon side" id="keyboard" aria-label="Écrire la question" aria-pressed="false" title="Écrire">
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    </button>
    <button type="button" class="orb" id="orb" data-state="idle" aria-label="Parler à l'assistant">
      <span class="orb-glow" aria-hidden="true"></span>
      <span class="orb-core" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="orb-shine" aria-hidden="true"></span>
    </button>
    <span class="side" aria-hidden="true"></span>
  </div>
</footer>

<div class="booting-veil" id="booting" role="status"><span class="orb-mini" aria-hidden="true"></span><p>Chargement des fiches de la commune…</p></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<p class="visually-hidden" id="announce" aria-live="polite"></p>
</body>
</html>
