name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test runner needs Node 22.12+; the packages themselves support 20+.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The repository scripts' own tests (they load the built core).
      - run: node --test "scripts/**/*.test.mjs"
      # The website's docs pages are generated from the markdown; they must be current.
      - run: pnpm site:check
      # The Ndiédieng demo on the website (site/ndiedieng) is built from examples/ndiedieng.
      - run: pnpm --filter @kalangu/example-ndiedieng check:web
      # Contributed translations: a lost placeholder or a missing key fails the build.
      - run: for f in locales/*.json; do node packages/core/dist/cli.js locale check "$f" --complete || exit 1; done

  runtime-node-20:
    name: Runtime smoke test (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm smoke
      # The packages as npm users get them: packed, installed in an empty project,
      # the CLI run, imported, typechecked against the published types, and an agent run.
      - run: node scripts/pack-check.mjs

  windows-setup:
    name: Windows setup and tests (Node 24)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # A fresh clone on Windows, as CONTRIBUTING.md describes: no pnpm yet, so the
      # setup script uses the pinned pnpm through npx. Run twice: the second run
      # must find nothing to do.
      - run: node scripts/setup.mjs
      - run: node scripts/setup.mjs
      - run: npm install -g pnpm@12.6.0
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test "scripts/**/*.test.mjs"
      # Byte-for-byte checks of generated files: they pass only with LF checkouts (.gitattributes).
      - run: pnpm site:check
      - run: pnpm --filter @kalangu/example-ndiedieng check:web
