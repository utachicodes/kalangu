# Static analysis for security problems in the TypeScript and the scripts.
# Results appear under the repository's Security tab, Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly, for new queries on unchanged code

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload the results
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          # The generated website pages and the built packages are outputs, not sources.
          config: |
            paths-ignore:
              - site/docs
              - site/contributing
              - site/security
              - site/ndiedieng/app
              - site/ndiedieng/vendor
              - "**/dist"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
