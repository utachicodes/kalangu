# Weekly update proposals. Each one is an ordinary pull request: CI must pass
# and a maintainer merges it; nothing updates on its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The packages support Node 20 ("engines"), so the types stay on Node 20:
      # newer types would let code use APIs that Node 20 does not have, unseen by
      # the typecheck. Raise this together with "engines", never on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates of the build and test tools, in one pull request.
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
